# Configuración de despliegue en Netlify.
# El formulario de contacto usa Netlify Forms (detección automática del HTML
# generado por el atributo data-netlify + honeypot bot-field).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Cabeceras de seguridad y privacidad (sin cookies de terceros).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Cache largo para las tipografías self-hosted y assets con hash.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fotos y favicons: caché de un día (se pueden reemplazar desde el panel).
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/liderazgo/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
